<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Movies - KUET Film Society</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="movies.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="movies-header">
        <nav class="movies-navbar">
            <div class="logo-container">
                <a href="index.html">
                    <img src="WhatsApp Image 2026-04-15 at 11.22.22 PM.jpeg" alt="KUET Film Society Logo" class="logo">
                </a>
            </div>
            <a href="index.html" class="back-btn">← Back</a>
        </nav>
    </header>

    <section class="movies-page-section">
        <div class="container">
            <h1 class="movies-page-title">ALL MOVIES</h1>

            <!-- Search Bar -->
            <div class="search-container">
                <input
                    type="text"
                    id="searchInput"
                    class="search-bar"
                    placeholder="Search movies by name or director..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>

            <!-- Movies Grid -->
            <div class="movies-grid-all" id="moviesGrid">
                <!-- Movies will be populated by JavaScript -->
            </div>

            <!-- No Results Message -->
            <div id="noResults" class="no-results" style="display: none;">
                <p>No movies found. Try searching with different keywords.</p>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-left">
                <h3 class="footer-logo">KUET Film Society</h3>
            </div>
            <div class="footer-center">
                <a href="index.html#about">About</a>
                <a href="movies.html">Movies</a>
                <a href="index.html#events">Events</a>
            </div>
            <div class="footer-right">
                <a href="https://www.facebook.com/share/1BJqsBvQ8F/" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="mailto:your-email@gmail.com"><i class="fas fa-envelope"></i></a>
                <a href="https://www.youtube.com/kuetfilmsociety" target="_blank"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 KUET Film Society. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="movies.js"></script>
</body>
</html>
